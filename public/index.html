<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dancing with the UBC Dance Club Stars - Vote Now!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/assets/main-BPuhXN6m.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/utils-BtKUMR5s.js">
    <link rel="stylesheet" crossorigin href="/assets/utils-C7kHM5sD.css">
  </head>
  <body class="gradient-bg min-h-screen text-white font-body">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
      <h1
        class="text-center text-gold-bright font-display text-5xl md:text-6xl mb-4"
      >
        🪩 Dancing with the UBC Dance Club Stars 🪩
      </h1>
      <p class="text-center text-xl mb-10">Vote for Your Favorite Couples!</p>

      <!-- Voting Status Message -->
      <div id="statusMessage" class="mb-6"></div>

      <!-- Voting Form -->
      <div id="votingForm">
        <!-- Voter Name Input (Optional) -->
        <div class="card mb-8">
          <label class="block text-sm font-medium mb-2"
            >Your Name (Optional)</label
          >
          <input
            type="text"
            id="voterName"
            placeholder="Enter your name or leave blank for anonymous"
            class="w-full px-4 py-3 bg-white/10 border border-gold-bright/30 rounded-lg focus:outline-none focus:border-gold-bright text-white"
          />
        </div>

        <!-- Auto-save info -->
        <div class="text-center my-6">
          <p class="text-sm text-white/50">
            🪩 Your votes are saved automatically. You can change your
            selections anytime while voting is open.
          </p>
        </div>

        <!-- Couples Grid -->
        <div
          id="couplesGrid"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6 mb-8"
        >
          <!-- Couples will be loaded here -->
        </div>

        <!-- Submit Button -->
        <div class="text-center">
          <button
            id="submitVotesBtn"
            class="btn-primary text-lg px-12 py-4 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Submit All Votes
          </button>
          <p class="text-sm text-white/70 mt-3">
            Click to submit your votes when ready
          </p>
        </div>
      </div>
    </div>

  </body>
</html>
